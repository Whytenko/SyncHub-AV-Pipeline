<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" fill="none">
  <!-- Head oval -->
  <ellipse cx="100" cy="95" rx="70" ry="88" stroke="currentColor" stroke-width="1.5" opacity="0.85"/>
  <!-- Neck -->
  <path d="M 80 176 L 78 215 L 122 215 L 120 176" stroke="currentColor" stroke-width="1.5" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shoulders -->
  <path d="M 2 255 C 35 228 68 215 78 215" stroke="currentColor" stroke-width="1.5" opacity="0.65" stroke-linecap="round"/>
  <path d="M 122 215 C 132 215 165 228 198 255" stroke="currentColor" stroke-width="1.5" opacity="0.65" stroke-linecap="round"/>
  <!-- Left ear -->
  <path d="M 31 78 C 18 88 17 103 18 114 C 19 124 26 133 36 136" stroke="currentColor" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <!-- Right ear -->
  <path d="M 169 78 C 182 88 183 103 182 114 C 181 124 174 133 164 136" stroke="currentColor" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <!-- Left eyebrow -->
  <path d="M 52 54 Q 68 45 86 49" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Right eyebrow -->
  <path d="M 114 49 Q 132 45 148 54" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Left eye outer -->
  <ellipse cx="70" cy="70" rx="15" ry="9" stroke="currentColor" stroke-width="1.5"/>
  <!-- Left eye iris -->
  <circle cx="70" cy="70" r="5" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
  <!-- Right eye outer -->
  <ellipse cx="130" cy="70" rx="15" ry="9" stroke="currentColor" stroke-width="1.5"/>
  <!-- Right eye iris -->
  <circle cx="130" cy="70" r="5" stroke="currentColor" stroke-width="1.3" opacity="0.75"/>
  <!-- Nose bridge + tip -->
  <path d="M 100 81 L 93 114" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <path d="M 100 81 L 107 114" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
  <!-- Left nostril -->
  <path d="M 86 117 Q 82 123 86 128 Q 93 132 100 130" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Right nostril -->
  <path d="M 114 117 Q 118 123 114 128 Q 107 132 100 130" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Upper lip / cupid bow -->
  <path d="M 74 145 Q 87 137 100 141 Q 113 137 126 145" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lower lip -->
  <path d="M 74 145 Q 100 163 126 145" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lip centre line -->
  <path d="M 78 145 Q 100 149 122 145" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  <!-- Chin hint -->
  <path d="M 88 172 Q 100 178 112 172" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.3" stroke-dasharray="2,3"/>
  <!-- Zone guide lines (right side) -->
  <line x1="173" y1="18"  x2="155" y2="18"  stroke="currentColor" stroke-width="0.8" opacity="0.18"/>
  <line x1="173" y1="68"  x2="148" y2="68"  stroke="currentColor" stroke-width="0.8" opacity="0.18"/>
  <line x1="173" y1="117" x2="148" y2="117" stroke="currentColor" stroke-width="0.8" opacity="0.18"/>
  <line x1="173" y1="143" x2="148" y2="143" stroke="currentColor" stroke-width="0.8" opacity="0.18"/>
  <line x1="173" y1="172" x2="150" y2="172" stroke="currentColor" stroke-width="0.8" opacity="0.18"/>
  <!-- Zone labels -->
  <text x="175" y="22"  font-size="9.5" fill="currentColor" opacity="0.3" font-family="system-ui, sans-serif" font-weight="500">Лоб</text>
  <text x="175" y="72"  font-size="9.5" fill="currentColor" opacity="0.3" font-family="system-ui, sans-serif" font-weight="500">Глаза</text>
  <text x="175" y="121" font-size="9.5" fill="currentColor" opacity="0.3" font-family="system-ui, sans-serif" font-weight="500">Нос</text>
  <text x="175" y="147" font-size="9.5" fill="currentColor" opacity="0.3" font-family="system-ui, sans-serif" font-weight="500">Губы</text>
  <text x="175" y="176" font-size="9.5" fill="currentColor" opacity="0.3" font-family="system-ui, sans-serif" font-weight="500">Подб.</text>
</svg>
